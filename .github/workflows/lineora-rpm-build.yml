name: LINEORA RPM OTA build

on:
  push:
    branches:
      - chatgpt-lineora-rpm-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip rpm build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct firmware source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lineora/src
          cat .ci/lineora-rpm/source.b64.* | base64 -d > /tmp/lineora/source.zip
          echo "8d0a17dd6851c8e711cabf98b09aef14bc11f433d5aeaecb0e97654643425622  /tmp/lineora/source.zip" | sha256sum -c -
          unzip -q /tmp/lineora/source.zip -d /tmp/lineora/src
          test -f /tmp/lineora/src/LineoraRpmEsp32/LineoraRpmEsp32.ino

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.11
        shell: bash
        run: |
          set -euo pipefail
          ESP32_INDEX="https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls "$ESP32_INDEX"
          arduino-cli core list

      - name: Compile ESP32-S3 N16R8 firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lineora/build
          arduino-cli compile             --fqbn "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,DebugLevel=warn"             --output-dir /tmp/lineora/build             --warnings all             /tmp/lineora/src/LineoraRpmEsp32
          ls -lah /tmp/lineora/build

      - name: Validate and stage OTA image
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find /tmp/lineora/build -maxdepth 1 -type f -name '*.ino.bin' -print -quit)"
          test -n "$APP_BIN"
          python3 - "$APP_BIN" <<'PY'
          import struct, sys
          p=sys.argv[1]
          data=open(p,'rb').read(64)
          assert len(data) >= 36, "Firmware header too short"
          assert data[0] == 0xE9, f"Wrong ESP image magic: {data[0]:#x}"
          chip=struct.unpack_from('<H', data, 12)[0]
          assert chip == 9, f"Wrong chip ID: {chip}"
          desc=struct.unpack_from('<I', data, 32)[0]
          assert desc == 0xABCD5432, f"Missing app descriptor magic: {desc:#x}"
          print("ESP32-S3 application header valid")
          PY
          mkdir -p .ci/lineora-rpm/output
          cp "$APP_BIN" .ci/lineora-rpm/output/LINEORA-RPM-ESP32-S3-v1.1.0-Entprellt-OTA.bin
          sha256sum .ci/lineora-rpm/output/LINEORA-RPM-ESP32-S3-v1.1.0-Entprellt-OTA.bin             > .ci/lineora-rpm/output/SHA256SUMS.txt
          {
            echo "Firmware: LINEORA RPM v1.1.0 Entprellt"
            echo "Target: ESP32-S3 N16R8"
            echo "Arduino-ESP32 core: 3.3.11"
            echo "Source archive SHA256: 8d0a17dd6851c8e711cabf98b09aef14bc11f433d5aeaecb0e97654643425622"
          } > .ci/lineora-rpm/output/BUILD_INFO.txt

      - name: Commit OTA result to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LINEORA firmware builder"
          git config user.email "actions@users.noreply.github.com"
          git add .ci/lineora-rpm/output
          if git diff --cached --quiet; then
            echo "Output unchanged."
            exit 0
          fi
          git commit -m "build: LINEORA RPM v1.1.0 OTA [skip rpm build]"
          git push origin HEAD:chatgpt-lineora-rpm-build
